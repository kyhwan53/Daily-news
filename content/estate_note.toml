# Claude의 부동산 코멘트: 메일 맨 위에 그대로 나갑니다. 유료 API를 쓰지 않으므로 자동 생성되지 않고,
# Claude Code에게 "부동산 코멘트 업데이트해줘"라고 요청하면 최근 뉴스/메일 기사를 조사해 이 파일을 새로 씁니다.
# 작성일(date)이 14일 이상 지나면 메일에 "업데이트할 때" 안내가 붙습니다.
date = "2026-11-15"
title = "서울은 '상승 둔화·양극화', 12월 토허제 연장 결정이 분기점"

[[point]]
head = "서울: 92주 연속 상승이지만 힘이 빠지는 중"
text = "부동산원 주간 서울 아파트 상승률이 10월 둘째 주 0.16% → 11월 둘째 주 0.07%로 4주째 축소. 강남3구에 이어 성동·강동이 하락 전환했고, 성북·강북 등 외곽은 오히려 상승폭이 커지는 '갈아타기' 장세입니다. 서울 매물은 8만 건을 넘었고 청약 1순위 신청자도 4년 만에 최저."

[[point]]
head = "경기 남부가 서울보다 뜨겁다"
text = "경기 아파트 매매 상승률이 9주 연속 서울을 웃돌고, 경기도 전세수급지수는 5년 만에 가장 빡빡합니다. 서울 규제(토허·대출 상한)를 피한 수요가 반도체 벨트·경기 남부로 옮겨간 흐름입니다."

[[point]]
head = "12월: 토허제·규제지역 연장 여부 결론"
text = "서울 전역·경기 12곳 토지거래허가구역이 12/31 만료됩니다. 국토부는 '연말까지 시장을 보고 종합 검토'하겠다고 했고, 외곽·경기 상승세 때문에 전면 해제 가능성은 낮다는 시각이 우세합니다. 서울시는 실거주 의무가 전월세 불안을 키운다며 완화를 요구 중이라, 일부 조정(지역·요건) 가능성은 열려 있습니다. 재초환 부과 시점 해석도 11월 중 정리 예정."

[[point]]
head = "영등포역 일대: 볼 것 세 가지"
text = "① 신통기획 후보지 추가 선정(대림동 680 포함, 11/13) — 후보지는 곧바로 토허구역으로 묶였습니다. ② 영등포1-2구역 등 정비구역 물건 경매에서 '조합원 지위 승계' 물건이 주목받는 중 — 투기과열지구에서 승계 가능한 몇 안 되는 경로입니다. ③ 쪽방촌 공공주택지구는 임시 이주를 마치고 A블록 연내 착공 목표(3월 발표 기준)라 착공 여부가 역 주변 정비의 신호가 됩니다. 문래 신규 분양(해링턴 플레이스 문래) 청약 11/23~26도 주변 시세 가늠자로 볼 만합니다."

[[point]]
head = "관심 지역: 사당/이수 · 동탄2"
text = "동탄은 2026.7.1 규제지역으로 지정됐는데도 국평 20억대 신고가가 나오며 경기 남부 상승을 이끄는 중이라, 12월 규제 재검토에서 해제보다 유지 쪽 압력이 큰 지역입니다. 이수역은 힐스테이트 이수역센트럴(931세대, 2028.4 입주 예정)이 들어오면서 주변 구축 시세의 기준점이 바뀔 수 있습니다."

[[point]]
head = "Claude의 제안 (투자 조언이 아니라 관점입니다)"
text = "지금은 서울 핵심지 상승세가 꺾이고 매물이 쌓이는 구간이라 '서두를 이유'보다 '가격 협상력'이 커지는 시기입니다. 실거주 매수라면 12월 규제 발표 전후의 변동을 지켜보면서, 관심 단지의 같은 평형 실거래를 쭉 모아 두는 것을 권합니다. 영등포 재개발은 구역별 단계(관리처분 전/후)에 따라 매수 가능 여부 자체가 달라지므로, 구역 이름 단위로 추적하세요."

[[watch]]
when = "매주 목요일"
what = "부동산원 주간 동향: 서울 상승폭이 0.05% 아래로 내려가는지, 영등포구 수치"

[[watch]]
when = "12월 중"
what = "토지거래허가구역·규제지역 연장/조정 발표 (국토부·서울시)"

[[watch]]
when = "11/23~26"
what = "해링턴 플레이스 문래 청약 경쟁률 — 영등포 신축 수요 온도계"

