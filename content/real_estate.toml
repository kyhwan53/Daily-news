        "분담금 = 조합원 분양가 − 권리가액. 공사비가 오르면 비례율이 떨어지고 분담금이 늘어납니다."]
check = "관리처분 전이라면 추정 비례율이 몇 %로 가정됐는지, 공사비 증액 협상 이슈가 있는지."

[[card]]
