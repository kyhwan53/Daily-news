        "비교 대상은 같은 지역 신축 아파트 시세입니다: 총 투자금이 인근 신축 시세보다 충분히 낮아야 기다린 보상이 생깁니다."]
check = "총 투자금 ÷ 인근 준신축 동일 평형 시세. 입주까지 남은 연수 × 연 기회비용도 더해서 비교."

