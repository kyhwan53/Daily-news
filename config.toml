# ===== 여기만 고치면 됩니다 =====
# 소스 추가/삭제는 `python manage.py add/remove`로도 가능하고, 이 파일을 직접 편집해도 됩니다.
# 변경 후에는 `python manage.py check`로 피드가 살아 있는지 확인하세요.

[settings]
max_minutes = 30                       # 하루 큐 최대 길이(분)
feed_days = 7                          # 개인 피드에 남길 일수
recipient = ""                         # 아침 메일 수신 주소 (비우면 GMAIL_USER 환경변수 사용; 공개 저장소라 주소를 적지 않음)
base_url = "https://kyhwan53.github.io/Daily-news"  # GitHub Pages 주소
cards_start = "2026-11-05"             # 업무 영어/일본어 카드 1일차 (content/*.toml을 이 날부터 하루 한 칸씩)

# --- 소스 목록 ---
# key   : 아래 schedule에서 쓰는 짧은 이름 (영문/숫자)
# label : 메일/피드에 표시될 이름
# rss   : 팟캐스트 RSS 주소
# mode  : "newest" = 최신 에피소드부터, "oldest" = 가장 오래된 것부터 순서대로(입문 커리큘럼용)

[[source]]
key = "biz"
label = "EN Business"
rss = "https://podcasts.files.bbci.co.uk/p0h6ffwg.rss"   # BBC Learning English For Work
mode = "newest"

[[source]]
key = "easy"
label = "EN Easy"
rss = "https://podcasts.files.bbci.co.uk/p02pc9tn.rss"   # BBC 6 Minute English
mode = "newest"

[[source]]
key = "sci"
label = "EN Science"
rss = "https://feeds.npr.org/510351/podcast.xml"         # NPR Short Wave
mode = "newest"

[[source]]
key = "talk"
label = "EN Talk"
rss = "https://feeds.feedburner.com/tedtalks_audio"      # TED Talks Daily
mode = "newest"

[[source]]
key = "lifekit"
label = "EN Life Kit"
rss = "https://feeds.npr.org/510338/podcast.xml"
mode = "newest"

[[source]]
key = "aee"
label = "EN All Ears"
rss = "https://allearsenglish.libsyn.com/rss"
mode = "newest"

# --- 읽기용 외신 기사 (RSS의 제목/요약/원문 링크만 사용, 전문은 복사하지 않음) ---
# section : 같은 section끼리 날마다 돌아가며 하루 1건씩 고릅니다 (section 수 = 하루 기사 수, 메일 순서는 아래 top 블록이 먼저).
#           top = 분야 구분 없는 주요 뉴스, business = 경제, environment = 환경·기후
#           새 분야를 넣으려면 새 section 이름으로 블록을 추가하면 됩니다.
[[article]]
key = "bbc_business"
section = "business"
label = "BBC Business"
rss = "https://feeds.bbci.co.uk/news/business/rss.xml"

[[article]]
key = "bbc_top"
section = "top"
label = "BBC Top Stories"
rss = "https://feeds.bbci.co.uk/news/rss.xml"

[[article]]
key = "npr_economy"
section = "business"
label = "NPR Economy"
rss = "https://feeds.npr.org/1017/rss.xml"

[[article]]
key = "npr_top"
section = "top"
label = "NPR News"
rss = "https://feeds.npr.org/1001/rss.xml"

[[article]]
key = "guardian_business"
section = "business"
label = "Guardian Business"
rss = "https://www.theguardian.com/uk/business/rss"

[[article]]
key = "guardian_top"
section = "top"
label = "Guardian Top Stories"
rss = "https://www.theguardian.com/international/rss"

[[article]]
key = "bbc_environment"
section = "environment"
label = "BBC Science & Environment"
rss = "https://feeds.bbci.co.uk/news/science_and_environment/rss.xml"

[[article]]
key = "guardian_environment"
section = "environment"
label = "Guardian Environment"
rss = "https://www.theguardian.com/uk/environment/rss"

[[article]]
key = "npr_climate"
section = "environment"
label = "NPR Climate"
rss = "https://feeds.npr.org/1167/rss.xml"

# --- 국내 리포트 (제목/저자 요약/원문 링크) ---
# slot  : "overnight"이면 KOREA REPORTS 대신 세계 경제 칸 맨 위(밤사이 미국)에 표시
# order : "newest"면 조회수보다 최신 우선 (매일 나오는 마감 시황용)
# naver : 네이버 증권 리서치 분류 (economy=경제분석, invest=투자정보, market=시황정보, debenture=채권분석,
#         industry=산업분석, company=종목분석) - 국내 증권사 리포트 모음, 최근 3일 중 조회수 1위
# rss   : RSS 주소 (한국은행 RSS 목록: https://www.bok.or.kr/static/view/popup/rss_popup.html) - 새 글이 있을 때만 표시
# count : 소스당 하루 최대 개수 (기본 1)
# prefer: 제목에 이 단어가 있는 리포트를 우선 (없으면 조회수 1위)
[[report]]
key = "nv_us_close"
label = "밤사이 미국 시장"
naver = "market"
slot = "overnight"
order = "newest"
prefer = ["미국 주식시장 마감", "미국 증시 마감", "뉴욕 증시", "미국"]

[[report]]
key = "nv_economy"
label = "증권사 경제분석"
naver = "economy"
prefer = ["미국", "미 ", "연준", "Fed", "FOMC", "뉴욕", "월가", "S&P", "나스닥", "다우", "빅테크", "달러", "US", "글로벌"]

[[report]]
key = "nv_invest"
label = "증권사 투자전략"
naver = "invest"
prefer = ["미국", "미 ", "연준", "Fed", "FOMC", "뉴욕", "월가", "S&P", "나스닥", "다우", "빅테크", "달러", "US", "글로벌"]

[[report]]
key = "bok_policy"
label = "한국은행 통화정책"
rss = "https://www.bok.or.kr/portal/bbs/P0000559/news.rss?menuNo=200690"

[[report]]
key = "bok_issue"
label = "한국은행 이슈노트"
rss = "https://www.bok.or.kr/portal/bbs/P0002353/news.rss?menuNo=200433"

# --- 중앙은행 회의 (정책 결정일, 해당 국가 현지 날짜) ---
# 다음 회의 날짜를 메일에 표시합니다. 해가 바뀌면 다음 해 일정을 추가하세요 (Claude에게 요청).
[central_banks]
fomc = ["2026-01-28", "2026-03-18", "2026-04-29", "2026-06-17", "2026-07-29", "2026-09-16", "2026-10-28", "2026-12-09"]
bok = []   # 한국은행 금통위 통화정책방향 결정일 (한국은행 홈페이지 > 통화정책 > 금융통화위원회 일정)

# --- 요일별 편성 (위에서 정의한 key 사용, 순서대로 재생) ---
[schedule]
mon = ["biz", "aee"]
tue = ["easy", "talk"]
wed = ["biz", "talk"]
thu = ["easy", "aee"]
fri = ["biz", "talk"]
sat = ["easy", "lifekit"]
sun = ["biz", "lifekit"]

# ===== 부동산 주간 브리핑 (별도 메일: build_estate.py, 매주 금요일) =====
# 뉴스는 Google News RSS 검색(무료, 키 없음)으로 모읍니다. 제목/언론사/링크만 사용합니다.
# 섹션마다 queries를 모두 검색해 같은 사건 기사를 묶고(보도 매체 수 = 중요도), 상위 count개를 고릅니다.
#   days    : 최근 며칠 기사만 (영등포처럼 기사가 적은 곳은 길게)
#   must    : 제목에 이 중 하나는 꼭 있어야 함 (지역 한정용, 생략 가능)
#   boost   : 제목에 있으면 우선
#   topic   : 제목에 이 중 하나는 있어야 함 (생략 시 [estate_settings].topic 사용, 빈 목록이면 검사 안 함)
#   exclude : 제목에 있으면 제외 ([estate_settings].exclude에 더해짐)
#   spread  : 단어 묶음마다 1건씩 먼저 고름 (여러 지역을 고르게 보고 싶을 때)
[estate_settings]
weekday = "fri"                        # 보내는 요일 (그날 실패하면 주말 안에 다시 시도)
cards = 2                              # 메일 1통에 넣을 투자 공부 카드 수
topic = ["아파트", "재개발", "재건축", "정비", "집값", "시세", "매매", "전세", "월세", "분양", "청약", "공공주택", "신통기획",
         "모아타운", "실거래", "신고가", "조합", "착공", "입주", "부동산", "주택", "대출", "DSR", "LTV", "토허", "토지거래",
         "규제지역", "양도세", "종부세", "취득세", "보유세", "재초환", "금리", "공급", "거래량", "경매", "역세권"]
exclude = ["[포토]", "[사진]", "[광고]", "[AD]", "운세", "부고", "인사]", "모델하우스 오픈", "포항", "부산", "대구", "광주광역",
           "대전", "울산", "세종", "창원", "전주", "청주", "천안", "제주", "강원", "충북", "충남", "전북", "전남", "경북", "경남"]
# 같은 사건을 여러 매체가 보도했을 때 대표 기사로 먼저 고를 언론사
major = ["연합뉴스", "한국경제", "매일경제", "서울경제", "조선비즈", "머니투데이", "이데일리", "헤럴드경제", "아시아경제",
         "파이낸셜뉴스", "뉴스1", "뉴시스", "땅집고", "비즈워치", "한겨레", "경향신문", "중앙일보", "동아일보"]

[[estate]]
key = "ydp"
label = "영등포역 일대 · 재개발/시세"
queries = ["영등포역 재개발", "영등포 재개발", "영등포 재정비촉진", "영등포 쪽방촌 공공주택", "영등포 아파트",
           "문래동 재개발", "당산 재건축", "신길뉴타운", "도림동 재개발", "대림동 재개발", "양평동 재개발", "신안산선 영등포"]
days = 7
count = 6
must = ["영등포", "문래", "당산", "신길", "도림", "양평", "대림", "신안산선"]
exclude = ["노숙인", "쪽방주민 겨울", "한파", "집창촌", "축제", "봉사"]

[[estate]]
key = "areas"
label = "관심 지역 · 사당/이수 · 동탄2"
queries = ["사당 아파트", "이수역 아파트", "사당 재건축", "사당 재개발", "동탄 아파트값", "동탄2신도시", "동탄역 아파트"]
days = 7
count = 4
must = ["사당", "이수역", "이수힐", "동탄"]
spread = [["사당", "이수역", "이수힐"], ["동탄"]]   # 지역마다 1건씩 먼저

[[estate]]
key = "metro"
label = "수도권 아파트 시세"
queries = ["서울 아파트값", "수도권 아파트 매매가격", "부동산원 주간 아파트", "KB 아파트 시세", "서울 아파트 신고가",
           "경기 아파트값", "서울 아파트 거래량", "서울 전셋값", "강남 아파트 시세", "마포 성동 아파트"]
days = 7
count = 5
boost = ["영등포", "서울", "주간", "부동산원", "거래량"]

[[estate]]
key = "invest"
label = "투자 체크 · 정책/대출/세금/청약"
queries = ["부동산 대책", "주택담보대출 규제", "스트레스 DSR", "토지거래허가구역", "규제지역 해제", "서울 청약 분양",
           "양도세 종부세 개편", "주담대 금리", "재건축 초과이익 환수", "주택 공급 대책 수도권", "전세대출 규제"]
days = 7
count = 5
boost = ["정부", "국토부", "금융위", "서울시", "발표", "시행", "확정"]

# 국토부 아파트 매매 실거래가 (선택). data.go.kr에서 "국토교통부_아파트 매매 실거래가 상세 자료" 활용신청(무료) 후
# GitHub Secret MOLIT_API_KEY에 일반 인증키를 넣으면 메일에 "실거래" 칸이 생깁니다. 없으면 그 칸만 빠집니다.
# 지역([[estate_deals.area]])마다: code = 시군구 코드(법정동코드 앞 5자리), dongs = 볼 법정동(앞부분 일치),
#   show = 새로 신고된 거래를 몇 건까지 보여줄지(비중), watch = 관심 단지
#   (apt = 단지명 일부, 띄어쓰기 무시 / exact = true면 이름 전체 일치 / area = 우선 볼 전용㎡)
# 단지명이 실거래 자료와 다르면 "최근 거래 없음"으로 나옵니다. 그때는 rt.molit.go.kr에서 정확한 이름을 확인해 고치세요.
[estate_deals]
months = 3                                   # "새로 신고" · 관심 단지: 최근 몇 개월 계약분
trend_months = 12                            # 가격 추이 그래프 기간 (이번 달은 신고 중이라 빼고 지난 12개월)
min_area = 59                                # 전용면적 범위(㎡): 59㎡형 ~ 84㎡형만 봄
max_area = 85

[[estate_deals.area]]
label = "영등포역 일대"
code = "11560"                               # 영등포구
dongs = ["영등포동", "당산동", "문래동", "양평동", "도림동", "신길동"]
show = 8
watch = [
  { apt = "아크로타워스퀘어", label = "영등포 아크로타워스퀘어", area = 84 },
  { apt = "영등포푸르지오", label = "영등포 푸르지오 (당산)", area = 84 },
  { apt = "당산센트럴아이파크", label = "당산 센트럴아이파크", area = 84 },
  { apt = "문래자이", label = "문래 자이", area = 84 },
  { apt = "래미안에스티움", label = "신길 래미안에스티움", area = 84 },
  { apt = "경남아너스빌", label = "영등포 경남아너스빌", area = 84, exact = true },   # exact: 보라매경남아너스빌 제외
]

[[estate_deals.area]]
label = "사당·이수역"
code = "11590"                               # 동작구 (이수역 서쪽 방배동은 서초구 11650)
dongs = ["사당동", "동작동"]
show = 3
watch = [
  { apt = "이수힐스테이트", label = "이수 힐스테이트 (동작동)", area = 84 },
  { apt = "로이파크", label = "래미안 이수역 로이파크", area = 84 },
  { apt = "사당우성2", label = "사당 우성2단지", area = 59 },
]

[[estate_deals.area]]
label = "동탄2신도시"
code = "41597"                               # 화성시 동탄구 (2026.2 분구). 거래가 0건으로 나오면 코드 확인 필요
dongs = ["여울동", "오산동", "청계동", "영천동", "중동", "신동", "목동", "산척동", "장지동", "송동", "방교동", "금곡동"]
show = 3
watch = [
  { apt = "동탄역롯데캐슬", label = "동탄역 롯데캐슬", area = 84 },
  { apt = "동탄역센트럴푸르지오", label = "동탄역 센트럴푸르지오", area = 84 },
]
